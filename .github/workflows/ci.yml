name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate detection rules
        run: logsentinel validate-rules

      - name: Smoke test CLI on sample logs
        run: |
          logsentinel analyze samples/auth.log --no-color
          logsentinel analyze samples/web_access.log --no-color
          logsentinel analyze samples/cloud_events.jsonl --no-color
