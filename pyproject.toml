[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.0"
description = "SOC Log Analyzer, Sigma-Style Detection Rule Engine, and MITRE ATT&CK Threat Triage CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Faizan Ahmad", email = "faizi-cybsec@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = [
    "cybersecurity",
    "soc",
    "siem",
    "threat-detection",
    "mitre-attack",
    "incident-response",
    "log-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/faizi-cybsec/LogSentinel"
Repository = "https://github.com/faizi-cybsec/LogSentinel"
Issues = "https://github.com/faizi-cybsec/LogSentinel/issues"
Changelog = "https://github.com/faizi-cybsec/LogSentinel/blob/main/CHANGELOG.md"

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
